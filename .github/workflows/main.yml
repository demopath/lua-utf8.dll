name: Compile lua-utf8

on:
  workflow_dispatch:
  push:
    branches: [auto]
  schedule:
    - cron: '0 7 * * *' # 7:00 

jobs:
  build:
    if: github.ref == 'refs/heads/auto'
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone luautf8
        run: |
          git clone --depth=1 https://github.com/starwing/luautf8
          copy luautf8\*.c .
          copy luautf8\*.h .
          
      - name: Compile lua-utf8.dll
        run: |
          gcc -shared -DLUA_BUILD_AS_DLL -I./lualib/include *.c ./lualib/liblua5.1.a -o ./lua/lua-utf8.dll

      - name: Commit 
        run: |
          git config --global user.name  "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add lua
          git commit -m "add lua-utf8.dll"
          git add *.c *.h 
          $commit_message = git -C luautf8 log -1 --pretty=%B
          git commit -m "Auto-commit: $commit_message"

      - name: Push
        run: git push        
      
